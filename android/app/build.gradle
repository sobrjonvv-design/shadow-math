plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zenmind.shadowmath'
    compileSdk 34

    defaultConfig {
        applicationId "com.zenmind.shadowmath"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero external dependencies required for fast, rock-solid APK compilation
}
