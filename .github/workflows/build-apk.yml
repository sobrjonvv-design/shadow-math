name: Build Android APK (Shadow Math Zen)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ShadowMath-Zen-Android.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMath-Zen-Android-APK
          path: ShadowMath-Zen-Android.apk
          if-no-files-found: error

      - name: Publish Automatic GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Shadow Math: Samurai Zen APK (Build #${{ github.run_number }})"
          body: |
            ### ⚔️ Shadow Math: Samurai Zen Edition (Android APK)
            - **Ориентация**: Горизонтальная (Fullscreen Landscape 16:9)
            - **Графика**: Скелетная 60 FPS анимация самураев в стиле *Shadow Fight 2*
            - **Кампания**: 25 уровней в 5 Актах (Башня Боссов)
            - **Оружейная**: 10 анимированных видов оружия (прокачка до 25 уровня)
            - **Офлайн-режим**: Полностью автономный APK (сохранение прогресса на устройстве)
            
            📲 **Скачайте файл `ShadowMath-Zen-Android.apk` ниже и установите на ваш Android-смартфон!**
          files: ShadowMath-Zen-Android.apk
